# Render Blueprint — free tier, no credit card required.
# Deploys the KneoSense backoffice API as a native Node web service.
#
# Free-tier tradeoffs (by design, chosen for the demo):
#   - No persistent disk: the SQLite file resets on every redeploy/restart.
#   - Sleeps after ~15 min idle; the next request cold-starts (~1 min).
#
# Render injects PORT; the server already reads process.env.PORT.
# Node version comes from backoffice/server/.node-version (node:sqlite needs 22+).
services:
  - type: web
    name: kneosense-backoffice
    runtime: node
    plan: free
    rootDir: backoffice/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

  # Doctor web (Vite). Served at root on its own onrender.com subdomain.
  - type: web
    name: kneosense-doctor
    runtime: static
    rootDir: backoffice/web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://kneosense-backoffice.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Patient web (Expo static export).
  - type: web
    name: kneosense-web
    runtime: static
    rootDir: kneosense
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: EXPO_PUBLIC_BACKOFFICE_URL
        value: https://kneosense-backoffice.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
