# Render Blueprint — free tier, no credit card required.
# Deploys the KneoSense backoffice API as a native Node web service.
#
# Persistence: set TURSO_DATABASE_URL + TURSO_AUTH_TOKEN (below, sync:false → set
# them in the Render dashboard, NOT in git) to persist data in Turso (libSQL).
# Without them the server falls back to an ephemeral local SQLite file that
# resets on every redeploy/restart. The service also sleeps after ~15 min idle
# (next request cold-starts ~1 min). Render injects PORT; the server reads it.
# Node version comes from backoffice/server/.node-version.
services:
  - type: web
    name: kneosense-backoffice
    runtime: node
    plan: free
    rootDir: backoffice/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

  # Doctor web (Vite). Served at root on its own onrender.com subdomain.
  - type: web
    name: kneosense-doctor
    runtime: static
    rootDir: backoffice/web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://kneosense-backoffice.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Patient web (Expo static export).
  - type: web
    name: kneosense-web
    runtime: static
    rootDir: kneosense
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: EXPO_PUBLIC_BACKOFFICE_URL
        value: https://kneosense-backoffice.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
